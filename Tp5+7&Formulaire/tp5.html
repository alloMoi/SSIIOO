<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="tps.css">
    <title>Inscription Nouveau Client - Méditerranée</title>
    <style>
        body{
            background-color: #9c9c9c;
        }
    </style>
</head>
<body>
<section>
    <form action="#" method="POST">
            <table width=”70%” border="0">
        <h1>Inscription d'un Nouveau Client</h1>

        <tr><td><label for="nom">Nom :</label></td>
        <td><input type="text" id="nom" name="nom"></td></tr>

        <tr><td><label for="prénom">Prénom :</label></td>
        <td><input type="text" id="prénom" name="prenom"></td></tr>

        <tr><td><label for="date de naissance">Date de naissance :</label></td>
        <td><input type="date" id="date-naissance" name="date-naissance"></td></tr>

        <tr><td><label for="email">Adresse mail :</label></td>
        <td><input type="email" id="email" name="email"></td></tr>

        <tr><td><label for="mdp">Mot de passe :</label></td>
        <td><input type="password" id="mdp" name="mdp"></td></tr>

        <tr><td><label for="permis">Numéro depermis :</label></td>
        <td><input type="text" id="permis" name="permis"></td></tr>

        <tr><td><label for="anciennete">Nombre d'années d'ancienneté :</label></td>
        <td><input type="number" id="anciennete" name="anciennete"></td></tr>

        <tr><td><label for="ville">Ville :</label></td>
        <td><select id="ville" name="ville">
        <option value="paris">Paris</option>
        <option value="versailles">Versailles</option>
        <option value="creteil">Créteil</option>
        </select></td></tr>

        <tr><td><label for="adresse">Adresse du client :</label>
        <td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td></tr>

        <tr><td><p>Situation matrimoniale :</p></td>
            <td><label for="marie_oui">Marié</label>
            <input type="radio" id="marie_oui" name="marie" value="oui">
            <label for="marie_non">Marié non</label>
            <input type="radio" id="marie_non" name="marie" value="non"></td></tr>

        <tr><td><p>Préference voiture :</p></td>
        <td><label for="pref_auto">Automatique</label>
        <input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
        <label for="pref_manuelle">Manuelle</label>
        <input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle"></td></tr>

        <tr><td><button type="submit">Enregistrer</button></td></tr>
        <tr><td><button type="reset">Annuler</button></td></tr>
        </table>
    </form>
</section>
<li><a href="../Menu&Sio/Les_projets.html"><h3>Retour au projets</h3></a></li>
<footer>
    <p>&copy;2026 Agence Méditerranée - Location de véhicules</p>
</footer>
</body>
</html>
