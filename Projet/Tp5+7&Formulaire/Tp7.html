<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="tps.css">
    <title>Ajout de véhicule</title>
</head>
<body>
<section>
    <form action="#" method="POST">
            <table width=”70%” border="0">
        <h1>Ajout d'un nouveau véhicule</h1>

        <tr><td><label for="marque">Marque :</label></td>
        <td><select id="marque" name="marque">
        <option value="peugeot">Peugeot</option>
        <option value="mercedes">Mercedes</option>
        <option value="renault">Renault</option>
        </select></td></tr>

        <tr><td><label for="immatriculation">Immatriculation :</label></td>
        <td><input type="text" id="immatriculation" name="immatriculation"></td></tr>

        <tr><td><label for="couleur">Couleur :</label></td>
        <td><input type="text" id="couleur" name="couleur"></td></tr>


        <tr><td><label for="kilometrage">Kiométrage :</label></td>
        <td><input type="number" id="kilometrage" name="kilometrage"></td></tr>

        <tr><td><label for="date de naissance">Date d'immatriculation' :</label></td>
        <td><input type="date" id="date-immatriculation" name="date-immatriculation"></td></tr>

        <tr><td><label for="porte">Nombre de porte :</label></td>
        <td><select id="porte" name="porte">
        <option value="2">- 2 -</option>
        <option value="4">- 4 -</option>
        </select></td></tr>

        <tr><td><p>Carburant :</p></td>
            <td><label for="hybride">Hybride</label>
            <input type="radio" id="hybride" name="carburant" value="hybride">
            <label for="electrique">Electrique</label>
            <input type="radio" id="electrique" name="carburant" value="electrique">
            <td><label for="diesel">Diesel</label>
            <input type="radio" id="diesel" name="carburant" value="diesel">
            <label for="essence">Essence</label>
            <input type="radio" id="essence" name="carburant" value="essence"></td></tr>

        <tr><td><p>Etat :</p></td>
            <td><label for="neuf">Neuf</label>
            <input type="radio" id="neuf" name="etat" value="neuf">
            <label for="ocassion">Occasion</label>
            <input type="radio" id="occasion" name="etat" value="occasion"></td></tr>

        <tr><td><p>Boite de vitesses :</p></td>
        <td><label for="5">- 5 -</label>
        <input type="checkbox" id="5" name="5_vitesse" value="5">
        <label for="6">- 6 -</label>
        <input type="checkbox" id="6" name="6_vitesse" value="6"></td></tr>

        <tr><td><label for="porte">Nombre de sieges :</label></td>
        <td><select id="sieges" name="sieges">
        <option value="5">- 5 -</option>
        <option value="7">- 7 -</option>
        </select></td></tr>

        <tr><td><p>Caméra de recul :</p></td>
        <td><label for="oui">Oui</label>
        <input type="checkbox" id="oui" name="oui" value="oui">
        <label for="non">Non</label>
        <input type="checkbox" id="non" name="non" value="non"></td></tr>

        <tr><td><button type="submit">Enregistrer</button></td></tr>
        <tr><td><button type="reset">Annuler</button></td></tr>
        </table>
    </form>
</section>
<footer>
    <h2><a href="../Menu&Sio/Les_projets.html">Retour aux projets</a></h2>
    <p>&copy;2026 Agence Méditerranée - Location de véhicules</p>
</footer>
</body>
</html>
